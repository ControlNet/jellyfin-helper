name: Docker Image Update

on:
  schedule:
    - cron: "0 * * * *" # Runs every day at midnight
  workflow_dispatch: # Allows manual triggering of the workflow
  push:
    branches:
      - master

jobs:
  check-version:
    runs-on: ubuntu-latest

    outputs:
      remote_version: ${{ steps.current-version.outputs.remote_version }}
      remote_minor_version: ${{ steps.current-version.outputs.remote_minor_version }}
      my_version: ${{ steps.my-version.outputs.my_version }}

    steps:
      - name: Set up Docker Hub credentials
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get the current tags from Docker Hub
        id: current-version
        run: |
          # Release tags are MAJOR.MINOR.PATCH up to 10.11.x, and MAJOR.MINOR from 12.0 onwards
          curl -s "https://registry.hub.docker.com/v2/repositories/jellyfin/jellyfin/tags?page_size=50" > remote_tags.json
          VERSION_TAG=$(jq -r '.results[] | select(.name | test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$")) | .name' remote_tags.json | sort -V | tail -n 1)
          if [ -z "$VERSION_TAG" ]; then
            echo "::error::No release tag matched in jellyfin/jellyfin, the upstream tagging scheme may have changed"
            exit 1
          fi
          MINOR_VERSION_TAG=$(echo $VERSION_TAG | awk -F '.' '{print $1"."$2}')
          echo "remote_version=$VERSION_TAG"
          echo "remote_minor_version=$MINOR_VERSION_TAG"
          echo "remote_version=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "remote_minor_version=$MINOR_VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Get the my tag from Docker Hub
        id: my-version
        run: |
          curl -s "https://registry.hub.docker.com/v2/repositories/controlnet/jellyfin/tags?page_size=10" > my_tags.json
          MY_VERSION=$(jq -r '.results[] | select(.name | test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$")) | .name' my_tags.json | sort -V | tail -n 1)
          echo "my_version=$MY_VERSION"
          echo "my_version=$MY_VERSION" >> $GITHUB_OUTPUT

  update-image:
    runs-on: ubuntu-latest
    needs: check-version
    if: github.event_name == 'workflow_dispatch' || needs.check-version.outputs.remote_version != needs.check-version.outputs.my_version

    steps:
      - name: Set up Docker Hub credentials
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Check out the current repository
        uses: actions/checkout@v3

      - name: Set up Version Tag
        run: |
          version="${{ needs.check-version.outputs.remote_version }}"
          if [ -z "$version" ]; then
            echo "::error::Empty upstream version tag, refusing to build"
            exit 1
          fi
          echo "version=$version" >> $GITHUB_ENV
          # MAJOR.MINOR releases make the minor tag identical to the version tag, so drop the duplicates
          {
            echo "tags<<TAGS_EOF"
            {
              echo "controlnet/jellyfin:latest"
              echo "$version" | awk -F '.' '{print "controlnet/jellyfin:" $1}'
              echo "$version" | awk -F '.' 'NF >= 2 {print "controlnet/jellyfin:" $1"."$2}'
              echo "controlnet/jellyfin:$version"
            } | awk '!seen[$0]++'
            echo "TAGS_EOF"
          } >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Dockerfile
        run: |
          sed "s|<VERSION_TAG>|${version}|g" Dockerfile_template > Dockerfile

      - name: Build the Docker image
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.tags }}
